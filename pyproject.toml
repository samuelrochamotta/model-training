[project]
name = "model-training"
version = "0.1.0"
description = "Laboratório para aprender os componentes de modelos de linguagem treinando GPTs pequenos no Mac."
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=6.29",
    "jupyterlab>=4.4",
    "matplotlib>=3.11",
    "mlx>=0.32",
    "mlx-lm>=0.32",
    "numpy>=2.5",
    "pytest>=8.3",
    "torch>=2.14",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lab"]
